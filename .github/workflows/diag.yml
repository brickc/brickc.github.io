name: Pages health check (temporary)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo gem install github-pages-health-check --no-document -q
      - name: Run GitHub's own Pages DNS checker
        run: |
          cat > hc.rb <<'RUBY'
          require "github-pages-health-check"
          %w[www.cameronbrick.com cameronbrick.com].each do |d|
            puts "=== #{d}"
            c = GitHubPages::HealthCheck::Domain.new(d)
            begin
              puts "valid?: #{c.valid?}"
              c.check!
            rescue => e
              puts "ERROR #{e.class}: #{e.message}"
            end
            %i[dns_resolves? proxied? cname_to_github_user_domain? pointed_to_github_pages_ip? apex_domain? should_be_a_record? caa_error invalid_aaaa_record? served_by_pages? https? https_error].each do |m|
              begin; puts "  #{m}: #{c.public_send(m).inspect}"; rescue => e; puts "  #{m}: raised #{e.class}: #{e.message}"; end
            end
            begin; puts "  dns: #{c.dns.inspect[0,600]}"; rescue => e; puts "  dns raised #{e.class}: #{e.message}"; end
          end
          RUBY
          ruby hc.rb
      - name: Raw DNS from authoritative servers (all record types GitHub queries)
        run: |
          for ns in ns.phx1.nearlyfreespeech.net ns.phx2.nearlyfreespeech.net; do
            for n in www.cameronbrick.com cameronbrick.com; do for t in A AAAA CNAME CAA MX NS SOA; do
              echo "@$ns $n $t: $(dig +norecurse +time=3 +tries=1 @$ns $n $t | grep -E 'status:|ANSWER:' | tr -s ' ' | head -2 | tr '\n' ' ')"
            done; done
          done
