name: DNS and HTTPS diagnostic (temporary)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for ns in ns.phx1.nearlyfreespeech.net ns.phx2.nearlyfreespeech.net 8.8.8.8 1.1.1.1; do
            echo "== $ns"; dig +short @$ns www.cameronbrick.com A; dig +short @$ns cameronbrick.com A; dig +short @$ns www.cameronbrick.com CAA
          done
          echo "== HTTPS www"; curl -sv -o /dev/null https://www.cameronbrick.com/ 2>&1 | grep -E 'subject:|issuer:|expire date|SSL certificate|HTTP/' || true
          echo "== HTTPS apex"; curl -sv -o /dev/null https://cameronbrick.com/ 2>&1 | grep -E 'subject:|issuer:|SSL certificate|HTTP/' || true
