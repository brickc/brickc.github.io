# Builds and publishes the site. Runs:
#  - whenever you commit a change (e.g. editing a page on github.com)
#  - once a day, to pull the CV from Dropbox (publications list + cv.pdf)
#  - on demand: Actions tab > "Update and publish site" > Run workflow
name: Update and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write    # commit the refreshed publications list
  pages: write       # publish to GitHub Pages
  id-token: write
  actions: write     # keepalive: stop GitHub disabling the daily schedule

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CV_URL: "https://www.dropbox.com/scl/fi/5j5sjjy6h8tr8bwnykf0v/Brick-CV.docx?rlkey=rj7lcwaec35qf713riy46tco7&dl=1"

jobs:
  # Step 1: pull the CV from Dropbox and commit any changes (fast; runs every time)
  sync:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v5

      - name: Install pandoc
        run: sudo apt-get update -q && sudo apt-get install -y -q pandoc python3-bs4

      - name: Download CV from Dropbox
        run: |
          curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/cv.docx" "$CV_URL"
          # a .docx is a zip file; anything else means Dropbox returned an error page
          head -c 2 "$RUNNER_TEMP/cv.docx" | grep -q PK || { echo "::error::Download is not a .docx. Has the Dropbox link changed?"; exit 1; }

      - name: Update publications from CV
        run: python3 scripts/update_publications.py "$RUNNER_TEMP/cv.docx" _includes/publications.html

      # cv.pdf is only regenerated when the .docx on Dropbox has changed
      # (cv.sha256 records which version the current PDF was made from).
      - name: Check whether the CV changed
        id: cvcheck
        run: |
          new=$(sha256sum "$RUNNER_TEMP/cv.docx" | cut -d' ' -f1)
          old=$(cat cv.sha256 2>/dev/null || true)
          if [ "$new" = "$old" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; echo "$new" > cv.sha256; fi

      - name: Convert CV to PDF
        if: steps.cvcheck.outputs.changed == 'true'
        run: |
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
          cp "$RUNNER_TEMP/cv.docx" "$RUNNER_TEMP/cv-src.docx"
          soffice --headless --convert-to pdf --outdir "$RUNNER_TEMP" "$RUNNER_TEMP/cv-src.docx"
          test -s "$RUNNER_TEMP/cv-src.pdf" || { echo "::error::PDF conversion failed"; exit 1; }
          mv "$RUNNER_TEMP/cv-src.pdf" cv.pdf

      - name: Commit if the CV or publications changed
        id: commit
        run: |
          git add -A _includes/publications.html cv.pdf cv.sha256
          if git diff --cached --quiet; then echo "No changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "CV sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update CV and publications from Dropbox"
          git push

      # Daily runs only republish when the publications changed;
      # edits and manual runs always republish.
      - name: Decide whether to publish
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "Nothing changed; skipping publish."
          fi

      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        uses: liskin/gh-workflow-keepalive@v1

  # Step 2: build the site (only when something needs publishing)
  build:
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # includes the CV sync commit, if step 1 made one
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v4

  # Step 3: publish
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
